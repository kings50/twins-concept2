<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store & Checkout</title>
    <!-- Paystack Inline JS SDK v2 -->
    <script src="https://js.paystack.co/v2/inline.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            background-color: #f9f9f9;
        }
        h1, h2 {
            color: #333;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .product-card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .product-card h3 {
            margin: 0 0 10px 0;
        }
        .btn {
            background-color: #09a5db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            background-color: #0784af;
        }
        .cart-section, .checkout-section {
            background: #fff;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
            padding: 8px 0;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Store Products</h1>
    
    <!-- Products List -->
    <div class="products-grid">
        <div class="product-card">
            <h3>Product 1</h3>
            <p>Price: ₦5,000</p>
            <button class="btn" onclick="addToCart('Product 1', 5000)">Add to Cart</button>
        </div>
        <div class="product-card">
            <h3>Product 2</h3>
            <p>Price: ₦10,000</p>
            <button class="btn" onclick="addToCart('Product 2', 10000)">Add to Cart</button>
        </div>
    </div>

    <!-- Shopping Cart Display -->
    <div class="cart-section">
        <h2>Your Cart</h2>
        <div id="cartItems">
            <p>Your cart is empty.</p>
        </div>
        <h3>Total: ₦<span id="cartTotal">0</span></h3>
    </div>

    <!-- Checkout Form -->
    <div class="checkout-section">
        <h2>Checkout Details</h2>
        <div class="input-group">
            <label for="customerEmail">Email Address:</label>
            <input type="email" id="customerEmail" placeholder="e.g. customer@example.com" required>
        </div>
        <button class="btn" style="width: 100%; font-size: 16px;" onclick="payNow()">Pay Now with Paystack</button>
    </div>

    <script>
        // Shopping cart state
        let cart = [];

        // Function to add products to cart
        function addToCart(name, price) {
            cart.push({ name: name, price: price });
            updateCart();
        }

        // Function to update Cart UI and Total
        function updateCart() {
            const cartItemsContainer = document.getElementById("cartItems");
            const cartTotalContainer = document.getElementById("cartTotal");

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = "<p>Your cart is empty.</p>";
                cartTotalContainer.innerText = "0";
                return;
            }

            let itemsHTML = "";
            let total = 0;

            cart.forEach((item, index) => {
                itemsHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span>₦${item.price.toLocaleString()}</span>
                    </div>
                `;
                total += item.price;
            });

            cartItemsContainer.innerHTML = itemsHTML;
            cartTotalContainer.innerText = total.toLocaleString();
        }

        // Function to handle Paystack Payment Initialization
        function payNow() {
            const emailInput = document.getElementById("customerEmail");

            // Validate email input
            if (!emailInput || !emailInput.value) {
                alert("Please enter a valid email address.");
                return;
            }

            const email = emailInput.value;
            const total = cart.reduce((sum, item) => sum + item.price, 0);

            // Validate cart total
            if (total <= 0) {
                alert("Your cart is empty. Add products before checking out.");
                return;
            }

            // Initialize Paystack Popup
            const popup = new Paystack();
            popup.newTransaction({
                key: "pk_live_3ef47af1f173a792e9b4e90a0538a8619b8d9cd2",
                email:"godswillsomto036@gmail.com", // Dynamic email variable from input field
                amount: total * 100, // Converts Naira total to Kobo
                currency: "NGN",
                channels: ['card', 'bank_transfer', 'ussd', 'bank'], // Enables Transfer, USSD, Card, & Bank
                onSuccess: function(transaction) {
                    alert("Payment successful!\nReference: " + transaction.reference);
                    cart = []; // Reset cart state
                    updateCart(); // Refresh cart UI
                    emailInput.value = ""; // Clear email field
                },
                onCancel: function() {
                    alert("Payment cancelled.");
                }
            });
        }
    </script>

</body>
</html>
